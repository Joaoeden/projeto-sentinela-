<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Medicações Prescritas</title>

  <link rel="stylesheet" href="css/style.css">

</head>


<body>

  <div class="container">

    <h1>💊 Medicações Prescritas</h1>

    <p>
      Consulte as medicações prescritas para os pacientes.
    </p>


    <div class="card">

      <h2>📋 Prescrições</h2>

      <div id="listaMedicacoes">

        <p>Carregando medicações...</p>

      </div>

    </div>

  </div>


  <script>

    // Busca as medicações prescritas no servidor
    function carregarMedicacoesPrescritas() {

      fetch("/medicacoes")

        .then(r => {

          if (!r.ok) {
            throw new Error("Erro ao buscar medicações.");
          }

          return r.json();

        })

        .then(data => {

          const div =
            document.getElementById("listaMedicacoes");

          div.innerHTML = "";


          // Nenhuma medicação encontrada
          if (data.length === 0) {

            div.innerHTML = `
              <div class="card">

                <h3>📭 Nenhuma prescrição encontrada</h3>

                <p>
                  Ainda não existem medicações prescritas
                  para exibir no sistema.
                </p>

              </div>
            `;

            return;
          }


          // Exibe cada prescrição
          data.forEach(c => {

            div.innerHTML += `

              <div class="card">

                <h3>👤 ${c.paciente}</h3>

                <p>
                  <b>💊 Medicação:</b>
                  ${c.medicacao}
                </p>

                <p>
                  <b>🩺 Diagnóstico:</b>
                  ${c.diagnostico}
                </p>

                <p>
                  <b>📝 Observações:</b>
                  ${c.obs || "Nenhuma"}
                </p>

                <span class="verde">
                  Prescrição registrada
                </span>

              </div>

            `;

          });

        })

        .catch(error => {

          console.error(error);

          document.getElementById("listaMedicacoes").innerHTML = `

            <div class="card">

              <h3>⚠️ Não foi possível carregar</h3>

              <p>
                O sistema não conseguiu acessar
                as medicações prescritas.
              </p>

              <span class="vermelho">
                Erro de conexão
              </span>

            </div>

          `;

        });

    }


    carregarMedicacoesPrescritas();

  </script>

</body>

</html>
