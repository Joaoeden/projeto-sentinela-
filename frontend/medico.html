```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel Médico</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <div class="container">

    <h1>🩺 Painel Médico</h1>

    <p>
      Gerenciamento de pacientes, consultas e prescrições.
    </p>


    <!-- ==================================================
         CONSULTÓRIO
    =================================================== -->

    <div class="card">

      <h2>📍 Consultório</h2>

      <p>
        Informe o número do consultório que será exibido
        na chamada do paciente.
      </p>

      <input
        type="text"
        id="consultorio-num"
        value="01"
        maxlength="4"
        placeholder="Número do consultório"
      >

      <button onclick="abrirTV()">
        📺 Abrir Tela da TV
      </button>

    </div>


    <!-- ==================================================
         FILA
    =================================================== -->

    <div class="card">

      <h2>👥 Pacientes na Triagem</h2>

      <div id="triagens">

        <p>
          Carregando pacientes...
        </p>

      </div>

    </div>


    <!-- ==================================================
         CONSULTA
    =================================================== -->

    <div class="card">

      <h2>🩺 Consulta</h2>


      <label>
        Paciente
      </label>

      <input
        type="text"
        id="paciente"
        placeholder="Paciente selecionado"
        readonly
      >


      <label>
        Diagnóstico
      </label>

      <input
        type="text"
        id="diagnostico"
        placeholder="Digite o diagnóstico"
      >


      <label>
        Medicação
      </label>

      <select id="medicacao">

        <option value="">
          Selecione a medicação
        </option>

      </select>


      <label>
        Observações médicas
      </label>

      <textarea
        id="obs"
        placeholder="Observações médicas"
      ></textarea>


      <button onclick="salvarConsulta()">
        💾 Salvar Consulta
      </button>

    </div>

  </div>


  <script>

    /* ==================================================
       VARIÁVEIS
    ================================================== */

    let triagensCarregadas = [];

    let pacienteSelecionado = null;


    /* ==================================================
       ABRIR TV
    ================================================== */

    function abrirTV() {

      window.open(
        "tv.html",
        "_blank"
      );

    }


    /* ==================================================
       ESCAPAR HTML
    ================================================== */

    function escaparHTML(texto) {

      return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ==================================================
       CARREGAR TRIAGENS
    ================================================== */

    function carregar() {

      fetch("/triagens")

        .then(response => {

          if (!response.ok) {

            throw new Error(
              "Erro ao carregar triagens."
            );

          }

          return response.json();

        })

        .then(data => {

          triagensCarregadas = data;

          const div =
            document.getElementById("triagens");

          div.innerHTML = "";


          if (
            !data ||
            data.length === 0
          ) {

            div.innerHTML = `

              <div class="card">

                <h3>
                  📭 Fila vazia
                </h3>

                <p>
                  Nenhum paciente está aguardando
                  atendimento.
                </p>

                <span class="verde">
                  Tudo em dia
                </span>

              </div>

            `;

            return;

          }


          data.forEach((t, index) => {

            const sintoma =
              t.sintoma ||
              t.sintomas ||
              "Não informado";


            const temperatura =
              t.temperatura ??
              t.temp ??
              "";


            const risco =
              t.risco ||
              "verde";


            const alergia =
              t.alergia ||
              "Nenhuma";


            const observacao =
              t.observacao ||
              "Nenhuma";


            div.innerHTML += `

              <div class="card">

                <h3>
                  👤 ${escaparHTML(t.nome)}
                </h3>


                <p>
                  <b>🩺 Sintoma:</b>
                  ${escaparHTML(sintoma)}
                </p>


                <p>
                  <b>🌡️ Temperatura:</b>
                  ${escaparHTML(String(temperatura))}
                  ${temperatura !== "" ? "°C" : ""}
                </p>


                <p>
                  <b>🚨 Classificação de risco:</b>
                </p>


                <span class="${escaparHTML(risco)}">
                  ${escaparHTML(risco)}
                </span>


                <p>
                  <b>⚠️ Alergia:</b>
                  ${escaparHTML(alergia)}
                </p>


                <p>
                  <b>📝 Observação:</b>
                  ${escaparHTML(observacao)}
                </p>


                <button
                  onclick="selecionar(${index})"
                >
                  🩺 Atender paciente
                </button>


                <button
                  onclick="chamarNaTV(${index})"
                >
                  📺 Chamar na TV
                </button>

              </div>

            `;

          });

        })

        .catch(error => {

          console.error(error);

          document.getElementById(
            "triagens"
          ).innerHTML = `

            <div class="card">

              <h3>
                ⚠️ Erro ao carregar a fila
              </h3>

              <p>
                Não foi possível carregar os pacientes.
              </p>

            </div>

          `;

        });

    }


    /* ==================================================
       SELECIONAR PACIENTE
    ================================================== */

    function selecionar(index) {

      const paciente =
        triagensCarregadas[index];


      if (!paciente) {

        alert(
          "Paciente não encontrado."
        );

        return;

      }


      pacienteSelecionado =
        paciente;


      document.getElementById(
        "paciente"
      ).value =
        paciente.nome;


      document.getElementById(
        "obs"
      ).value =
        paciente.observacao || "";


      document.getElementById(
        "diagnostico"
      ).value = "";


      document.getElementById(
        "medicacao"
      ).value = "";


      if (

        paciente.alergia &&

        paciente.alergia.toLowerCase() !==
        "nenhuma" &&

        paciente.alergia.toLowerCase() !==
        "nao" &&

        paciente.alergia.toLowerCase() !==
        "não"

      ) {

        alert(

          "⚠️ ATENÇÃO!\n\n" +
          "Paciente possui alergia a:\n\n" +
          paciente.alergia

        );

      }


      document
        .getElementById("paciente")
        .scrollIntoView({

          behavior: "smooth",

          block: "center"

        });

    }


    /* ==================================================
       CHAMAR NA TV
    ================================================== */

    function chamarNaTV(index) {

      const paciente =
        triagensCarregadas[index];


      if (!paciente) {

        alert(
          "Paciente não encontrado."
        );

        return;

      }


      const consultorio =
        document
          .getElementById("consultorio-num")
          .value
          .trim() || "01";


      fetch("/tv/chamar", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          localTipo:
            "CONSULTÓRIO",

          localNumero:
            consultorio,

          paciente:
            paciente.nome

        })

      })

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "Erro ao chamar paciente."
          );

        }

        return response.json();

      })

      .then(() => {

        alert(

          "✅ " +
          paciente.nome +
          " foi chamado na TV para o Consultório " +
          consultorio +
          "!"

        );

      })

      .catch(error => {

        console.error(error);

        alert(
          "❌ Não foi possível chamar o paciente na TV."
        );

      });

    }


    /* ==================================================
       CARREGAR MEDICAÇÕES
    ================================================== */

    function carregarMedicacoes() {

      fetch("/lista-medicacoes")

        .then(response => {

          if (!response.ok) {

            throw new Error(
              "Erro ao carregar medicações."
            );

          }

          return response.json();

        })

        .then(data => {

          const select =
            document.getElementById(
              "medicacao"
            );


          select.innerHTML = `

            <option value="">
              Selecione a medicação
            </option>

          `;


          data.forEach(medicacao => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              medicacao;

            option.textContent =
              medicacao;


            select.appendChild(
              option
            );

          });

        })

        .catch(error => {

          console.error(error);

        });

    }


    /* ==================================================
       SALVAR CONSULTA
    ================================================== */

    function salvarConsulta() {

      const paciente =
        document
          .getElementById("paciente")
          .value
          .trim();


      const diagnostico =
        document
          .getElementById("diagnostico")
          .value
          .trim();


      const medicacao =
        document
          .getElementById("medicacao")
          .value;


      const obs =
        document
          .getElementById("obs")
          .value
          .trim();


      if (!paciente) {

        alert(
          "⚠️ Primeiro selecione um paciente."
        );

        return;

      }


      if (!diagnostico) {

        alert(
          "⚠️ Informe o diagnóstico."
        );

        return;

      }


      if (!medicacao) {

        alert(
          "⚠️ Selecione uma medicação."
        );

        return;

      }


      const dados = {

        paciente:
          paciente,

        pacienteId:
          pacienteSelecionado
            ? pacienteSelecionado.pacienteId
            : null,

        triagemId:
          pacienteSelecionado
            ? pacienteSelecionado.id
            : null,

        diagnostico:
          diagnostico,

        medicacao:
          medicacao,

        obs:
          obs

      };


      fetch("/consulta", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify(dados)

      })

      .then(response => {

        return response.json()
          .then(data => ({

            ok:
              response.ok,

            data:
              data

          }));

      })

      .then(resultado => {

        if (!resultado.ok) {

          throw new Error(

            resultado.data.erro ||
            "Erro ao salvar consulta."

          );

        }


        alert(
          "✅ Consulta salva com sucesso!"
        );


        document.getElementById(
          "diagnostico"
        ).value = "";


        document.getElementById(
          "medicacao"
        ).value = "";


        document.getElementById(
          "obs"
        ).value = "";


        pacienteSelecionado =
          null;


        document.getElementById(
          "paciente"
        ).value = "";


        carregar();

      })

      .catch(error => {

        console.error(error);

        alert(

          "❌ Não foi possível salvar a consulta.\n\n" +
          error.message

        );

      });

    }


    /* ==================================================
       INICIALIZAÇÃO
    ================================================== */

    carregar();

    carregarMedicacoes();


    setInterval(
      carregar,
      10000
    );

  </script>

</body>

</html>
```
