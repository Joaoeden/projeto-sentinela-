<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel Médico</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <div class="container">

    <h1>🩺 Painel Médico</h1>

    <p>
      Gerenciamento de pacientes, consultas e prescrições.
    </p>


    <!-- =================================================
         CONTROLE DO CONSULTÓRIO
    ================================================== -->

    <div class="card">

      <h2>📍 Consultório</h2>

      <p>
        Informe o número do consultório que será exibido
        na chamada do paciente.
      </p>

      <input
        type="text"
        id="consultorio-num"
        value="01"
        maxlength="4"
        placeholder="Número do consultório"
      >

      <button
        onclick="window.open('tv.html','_blank')"
      >
        📺 Abrir Tela da TV
      </button>

    </div>


    <!-- =================================================
         FILA DE PACIENTES
    ================================================== -->

    <div class="card">

      <h2>👥 Pacientes na Triagem</h2>

      <div id="triagens">

        <p>
          Carregando pacientes...
        </p>

      </div>

    </div>


    <!-- =================================================
         ÁREA DA CONSULTA
    ================================================== -->

    <div class="card">

      <h2>🩺 Consulta</h2>

      <input
        id="paciente"
        placeholder="Paciente selecionado"
        readonly
      >


      <input
        id="diagnostico"
        placeholder="Diagnóstico"
      >


      <select id="medicacao">

        <option value="">
          Selecione a medicação
        </option>

      </select>


      <textarea
        id="obs"
        placeholder="Observações médicas"
      ></textarea>


      <!-- SALVAR -->

      <button onclick="salvar()">

        💾 Salvar Consulta

      </button>


      <!-- BAIXAR PDF -->

      <button
        id="btnPDF"
        onclick="baixarPDF()"
        disabled
      >

        📄 Baixar Consulta em PDF

      </button>


      <p id="statusPDF"></p>

    </div>

  </div>


  <script>


    // =====================================================
    // VARIÁVEIS
    // =====================================================

    let triagensCarregadas = [];

    let ultimaConsultaId = null;


    // =====================================================
    // CARREGAR TRIAGENS
    // =====================================================

    function carregar() {

      fetch("/triagens")

        .then(r => {

          if (!r.ok) {

            throw new Error(
              "Erro ao carregar triagens."
            );

          }

          return r.json();

        })

        .then(data => {

          triagensCarregadas = data;


          const div =
            document.getElementById(
              "triagens"
            );


          div.innerHTML = "";


          // ---------------------------------------------
          // FILA VAZIA
          // ---------------------------------------------

          if (data.length === 0) {

            div.innerHTML = `

              <div class="card">

                <h3>📭 Fila vazia</h3>

                <p>
                  Nenhum paciente está aguardando
                  atendimento no momento.
                </p>

                <span class="verde">
                  Tudo em dia
                </span>

              </div>

            `;

            return;

          }


          // ---------------------------------------------
          // LISTA
          // ---------------------------------------------

          data.forEach((t, index) => {

            div.innerHTML += `

              <div class="card">

                <h3>
                  👤 ${t.nome}
                </h3>

                <p>

                  <b>🩺 Sintoma:</b>

                  ${t.sintoma || "Não informado"}

                </p>


                <p>

                  <b>🌡️ Temperatura:</b>

                  ${t.temperatura || "Não informada"}°C

                </p>


                <p>

                  <b>🚨 Classificação de risco:</b>

                </p>


                <span class="${t.risco}">

                  ${t.risco}

                </span>


                <p>

                  <b>⚠️ Alergia:</b>

                  ${t.alergia || "Nenhuma"}

                </p>


                <p>

                  <b>📝 Observação:</b>

                  ${t.observacao || "Nenhuma"}

                </p>


                <button
                  onclick="selecionar(${index})"
                >

                  🩺 Atender paciente

                </button>


                <button
                  onclick="chamarNaTV('${t.nome.replace(/'/g, "\\'")}')"
                >

                  📺 Chamar na TV

                </button>

              </div>

            `;

          });

        })

        .catch(error => {

          console.error(error);


          document.getElementById(
            "triagens"
          ).innerHTML = `

            <div class="card">

              <h3>
                ⚠️ Erro ao carregar a fila
              </h3>

              <p>
                Não foi possível obter os pacientes
                da triagem.
              </p>

              <span class="vermelho">
                Erro de conexão
              </span>

            </div>

          `;

        });

    }


    // =====================================================
    // CHAMAR PACIENTE NA TV
    // =====================================================

    function chamarNaTV(nome) {

      const consultorio =
        document.getElementById(
          "consultorio-num"
        ).value || "01";


      fetch("/tv/chamar", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          localTipo: "CONSULTÓRIO",

          localNumero: consultorio,

          paciente: nome

        })

      })

      .then(r => {

        if (!r.ok) {

          throw new Error(
            "Erro ao chamar paciente."
          );

        }

        return r.json();

      })

      .then(() => {

        alert(

          "✅ " +
          nome +
          " foi chamado na TV para o Consultório " +
          consultorio +
          "!"

        );

      })

      .catch(error => {

        console.error(error);

        alert(
          "Não foi possível chamar o paciente na TV."
        );

      });

    }


    // =====================================================
    // SELECIONAR PACIENTE
    // =====================================================

    function selecionar(index) {

      const t =
        triagensCarregadas[index];


      document.getElementById(
        "paciente"
      ).value = t.nome;


      document.getElementById(
        "obs"
      ).value =
        t.observacao || "";


      // Limpa consulta anterior

      document.getElementById(
        "diagnostico"
      ).value = "";


      document.getElementById(
        "medicacao"
      ).value = "";


      // Remove PDF anterior

      ultimaConsultaId = null;


      document.getElementById(
        "btnPDF"
      ).disabled = true;


      document.getElementById(
        "statusPDF"
      ).textContent = "";


      // Alerta de alergia

      if (

        t.alergia &&
        t.alergia !== "Nenhuma"

      ) {

        alert(

          "⚠️ Paciente possui alergia: " +
          t.alergia

        );

      }


      // Leva até consulta

      document
        .getElementById("paciente")
        .scrollIntoView({

          behavior: "smooth",

          block: "center"

        });

    }


    // =====================================================
    // CARREGAR MEDICAÇÕES
    // =====================================================

    function carregarMedicacoes() {

      fetch("/lista-medicacoes")

        .then(r => {

          if (!r.ok) {

            throw new Error(
              "Erro ao carregar medicações."
            );

          }

          return r.json();

        })

        .then(data => {

          const select =
            document.getElementById(
              "medicacao"
            );


          select.innerHTML = `

            <option value="">

              Selecione a medicação

            </option>

          `;


          data.forEach(med => {

            const option =
              document.createElement(
                "option"
              );


            option.value = med;

            option.textContent = med;


            select.appendChild(option);

          });

        })

        .catch(error => {

          console.error(error);

        });

    }


    // =====================================================
    // SALVAR CONSULTA
    // =====================================================

    function salvar() {

      const paciente =
        document.getElementById(
          "paciente"
        ).value;


      const diagnostico =
        document.getElementById(
          "diagnostico"
        ).value.trim();


      const medicacao =
        document.getElementById(
          "medicacao"
        ).value;


      const obs =
        document.getElementById(
          "obs"
        ).value.trim();


      // ---------------------------------------------
      // VALIDAÇÃO
      // ---------------------------------------------

      if (!paciente) {

        alert(
          "Selecione um paciente clicando em Atender."
        );

        return;

      }


      if (!diagnostico) {

        alert(
          "Informe o diagnóstico."
        );

        return;

      }


      if (!medicacao) {

        alert(
          "Selecione uma medicação."
        );

        return;

      }


      // ---------------------------------------------
      // DESABILITA BOTÃO DURANTE O ENVIO
      // ---------------------------------------------

      const botao =
        document.querySelector(
          'button[onclick="salvar()"]'
        );


      botao.disabled = true;

      botao.textContent =
        "⏳ Salvando...";


      // ---------------------------------------------
      // ENVIA PARA O SERVIDOR
      // ---------------------------------------------

      fetch("/consulta", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          paciente: paciente,

          diagnostico: diagnostico,

          medicacao: medicacao,

          obs: obs

        })

      })

      .then(r => {

        if (!r.ok) {

          return r.json()
            .then(data => {

              throw new Error(
                data.erro ||
                "Erro ao salvar consulta."
              );

            });

        }

        return r.json();

      })

      .then(data => {

        // Guarda ID da consulta

        ultimaConsultaId =
          data.consulta.id;


        // Libera botão PDF

        document.getElementById(
          "btnPDF"
        ).disabled = false;


        document.getElementById(
          "statusPDF"
        ).textContent =
          "✅ Consulta salva. PDF disponível.";


        alert(
          "✅ Consulta salva com sucesso!"
        );


        // -----------------------------------------
        // LIMPAR CAMPOS
        // -----------------------------------------

        document.getElementById(
          "diagnostico"
        ).value = "";


        document.getElementById(
          "medicacao"
        ).value = "";


        document.getElementById(
          "obs"
        ).value = "";


        // Atualizar fila

        carregar();


        // -----------------------------------------
        // BAIXAR PDF AUTOMATICAMENTE
        // -----------------------------------------

        baixarPDF();

      })

      .catch(error => {

        console.error(error);


        alert(
          error.message ||
          "Não foi possível salvar a consulta."
        );

      })

      .finally(() => {

        botao.disabled = false;

        botao.textContent =
          "💾 Salvar Consulta";

      });

    }


    // =====================================================
    // BAIXAR PDF
    // =====================================================

    function baixarPDF() {

      if (!ultimaConsultaId) {

        alert(
          "Salve uma consulta primeiro."
        );

        return;

      }


      const url =
        "/consulta/" +
        ultimaConsultaId +
        "/pdf";


      // Cria link temporário

      const link =
        document.createElement("a");


      link.href = url;

      link.target = "_blank";

      link.download =
        "consulta-" +
        ultimaConsultaId +
        ".pdf";


      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

    }


    // =====================================================
    // INICIALIZAÇÃO
    // =====================================================

    carregar();

    carregarMedicacoes();


    // Atualiza fila a cada 10 segundos

    setInterval(
      carregar,
      10000
    );

  </script>

</body>

</html>
