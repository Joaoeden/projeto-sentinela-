<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel Médico</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <div class="container">

    <h1>🩺 Painel Médico</h1>

    <p>
      Gerenciamento de pacientes, consultas e prescrições.
    </p>


    <!-- =================================================
         CONSULTÓRIO
    ================================================== -->

    <div class="card">

      <h2>📍 Consultório</h2>

      <p>
        Informe o número do consultório que será exibido
        na chamada do paciente.
      </p>


      <input
        type="text"
        id="consultorio-num"
        value="01"
        maxlength="4"
        placeholder="Número do consultório"
      >


      <button
        onclick="window.open('tv.html','_blank')"
      >

        📺 Abrir Tela da TV

      </button>

    </div>


    <!-- =================================================
         FILA
    ================================================== -->

    <div class="card">

      <h2>👥 Pacientes na Triagem</h2>


      <div id="triagens">

        <p>
          Carregando pacientes...
        </p>

      </div>

    </div>


    <!-- =================================================
         CONSULTA
    ================================================== -->

    <div class="card">

      <h2>🩺 Consulta</h2>


      <!-- PACIENTE -->

      <input
        id="paciente"
        placeholder="Paciente selecionado"
        readonly
      >


      <!-- DIAGNÓSTICO -->

      <input
        id="diagnostico"
        placeholder="Diagnóstico"
      >


      <!-- MEDICAÇÃO -->

      <select id="medicacao">

        <option value="">
          Selecione a medicação
        </option>

      </select>


      <!-- OBSERVAÇÕES -->

      <textarea
        id="obs"
        placeholder="Observações médicas"
      ></textarea>


      <!-- =================================================
           MOTIVO DA ALTA
      ================================================== -->

      <label for="motivoAlta">

        <b>🏥 Motivo da alta / saída</b>

      </label>


      <select id="motivoAlta">

        <option value="">

          Selecione o motivo da alta/saída

        </option>


        <option value="Alta médica">

          Alta médica

        </option>


        <option value="Encaminhamento">

          Encaminhamento

        </option>


        <option value="Transferência">

          Transferência

        </option>


        <option value="Retorno para casa">

          Retorno para casa

        </option>


        <option value="Outro">

          Outro

        </option>

      </select>


      <!-- JUSTIFICATIVA -->

      <textarea
        id="justificativaAlta"
        placeholder="Especifique o motivo da alta/saída do paciente"
      ></textarea>


      <!-- =================================================
           SALVAR
      ================================================== -->

      <button
        id="btnSalvar"
        onclick="salvar()"
      >

        💾 Salvar Consulta

      </button>


      <!-- =================================================
           PDF
      ================================================== -->

      <button
        id="btnPDF"
        onclick="baixarPDF()"
        disabled
      >

        📄 Baixar Consulta em PDF

      </button>


      <p id="statusPDF"></p>

    </div>

  </div>


  <script>


    // =====================================================
    // VARIÁVEIS
    // =====================================================

    let triagensCarregadas = [];

    let ultimaConsultaId = null;


    // =====================================================
    // CARREGAR TRIAGENS
    // =====================================================

    function carregar() {

      fetch("/triagens")

        .then(r => {

          if (!r.ok) {

            throw new Error(
              "Erro ao carregar triagens."
            );

          }

          return r.json();

        })

        .then(data => {

          triagensCarregadas = data;


          const div =
            document.getElementById(
              "triagens"
            );


          div.innerHTML = "";


          // =================================================
          // FILA VAZIA
          // =================================================

          if (data.length === 0) {

            div.innerHTML = `

              <div class="card">

                <h3>📭 Fila vazia</h3>

                <p>
                  Nenhum paciente está aguardando
                  atendimento no momento.
                </p>

                <span class="verde">
                  Tudo em dia
                </span>

              </div>

            `;

            return;

          }


          // =================================================
          // LISTAR PACIENTES
          // =================================================

          data.forEach((t, index) => {


            const risco =
              t.risco || "verde";


            div.innerHTML += `

              <div class="card">

                <h3>
                  👤 ${escapeHTML(t.nome)}
                </h3>


                <p>

                  <b>🩺 Sintoma:</b>

                  ${escapeHTML(
                    t.sintoma ||
                    "Não informado"
                  )}

                </p>


                <p>

                  <b>🌡️ Temperatura:</b>

                  ${
                    t.temperatura ||
                    "Não informada"
                  }°C

                </p>


                <p>

                  <b>🚨 Classificação de risco:</b>

                </p>


                <span class="${escapeHTML(risco)}">

                  ${escapeHTML(risco)}

                </span>


                <p>

                  <b>⚠️ Alergia:</b>

                  ${escapeHTML(
                    t.alergia ||
                    "Nenhuma"
                  )}

                </p>


                <p>

                  <b>📝 Observação:</b>

                  ${escapeHTML(
                    t.observacao ||
                    "Nenhuma"
                  )}

                </p>


                <!-- CHAMAR NA TV -->

                <button
                  onclick="chamarNaTV(${index})"
                >

                  📺 Chamar na TV

                </button>


                <!-- ATENDER -->

                <button
                  onclick="selecionar(${index})"
                >

                  🩺 Atender paciente

                </button>

              </div>

            `;

          });

        })

        .catch(error => {

          console.error(error);


          document.getElementById(
            "triagens"
          ).innerHTML = `

            <div class="card">

              <h3>
                ⚠️ Erro ao carregar a fila
              </h3>

              <p>
                Não foi possível obter os pacientes
                da triagem.
              </p>

              <span class="vermelho">
                Erro de conexão
              </span>

            </div>

          `;

        });

    }


    // =====================================================
    // PROTEGER TEXTO HTML
    // =====================================================

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text ?? "";

      return div.innerHTML;

    }


    // =====================================================
    // CHAMAR PACIENTE NA TV
    // =====================================================

    function chamarNaTV(index) {

      const t =
        triagensCarregadas[index];


      if (!t) {

        alert(
          "Paciente não encontrado."
        );

        return;

      }


      const consultorio =
        document.getElementById(
          "consultorio-num"
        ).value.trim() || "01";


      fetch("/tv/chamar", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          localTipo:
            "CONSULTÓRIO",

          localNumero:
            consultorio,

          paciente:
            t.nome

        })

      })

      .then(r => {

        if (!r.ok) {

          throw new Error(
            "Erro ao chamar paciente."
          );

        }

        return r.json();

      })

      .then(() => {

        alert(

          "📺 " +
          t.nome +
          " foi chamado na TV.\n\n" +
          "Consultório: " +
          consultorio

        );

      })

      .catch(error => {

        console.error(error);

        alert(
          "Não foi possível chamar o paciente na TV."
        );

      });

    }


    // =====================================================
    // SELECIONAR PACIENTE
    // =====================================================

    function selecionar(index) {

      const t =
        triagensCarregadas[index];


      if (!t) {

        return;

      }


      document.getElementById(
        "paciente"
      ).value =
        t.nome;


      document.getElementById(
        "obs"
      ).value =
        t.observacao || "";


      // Limpar campos anteriores

      document.getElementById(
        "diagnostico"
      ).value = "";


      document.getElementById(
        "medicacao"
      ).value = "";


      document.getElementById(
        "motivoAlta"
      ).value = "";


      document.getElementById(
        "justificativaAlta"
      ).value = "";


      // PDF anterior

      ultimaConsultaId = null;


      document.getElementById(
        "btnPDF"
      ).disabled = true;


      document.getElementById(
        "statusPDF"
      ).textContent = "";


      // Alerta de alergia

      if (

        t.alergia &&
        t.alergia !== "Nenhuma"

      ) {

        alert(

          "⚠️ Paciente possui alergia: " +
          t.alergia

        );

      }


      // Ir para consulta

      document
        .getElementById("paciente")
        .scrollIntoView({

          behavior: "smooth",

          block: "center"

        });

    }


    // =====================================================
    // CARREGAR MEDICAÇÕES
    // =====================================================

    function carregarMedicacoes() {

      fetch("/lista-medicacoes")

        .then(r => {

          if (!r.ok) {

            throw new Error(
              "Erro ao carregar medicações."
            );

          }

          return r.json();

        })

        .then(data => {

          const select =
            document.getElementById(
              "medicacao"
            );


          select.innerHTML = `

            <option value="">

              Selecione a medicação

            </option>

          `;


          data.forEach(med => {

            const option =
              document.createElement(
                "option"
              );


            option.value = med;

            option.textContent = med;


            select.appendChild(option);

          });

        })

        .catch(error => {

          console.error(error);

        });

    }


    // =====================================================
    // SALVAR CONSULTA
    // =====================================================

    function salvar() {

      const paciente =
        document.getElementById(
          "paciente"
        ).value.trim();


      const diagnostico =
        document.getElementById(
          "diagnostico"
        ).value.trim();


      const medicacao =
        document.getElementById(
          "medicacao"
        ).value;


      const obs =
        document.getElementById(
          "obs"
        ).value.trim();


      const motivoAlta =
        document.getElementById(
          "motivoAlta"
        ).value;


      const justificativaAlta =
        document.getElementById(
          "justificativaAlta"
        ).value.trim();


      // =================================================
      // VALIDAÇÕES
      // =================================================

      if (!paciente) {

        alert(
          "Selecione um paciente clicando em Atender."
        );

        return;

      }


      if (!diagnostico) {

        alert(
          "Informe o diagnóstico."
        );

        return;

      }


      if (!medicacao) {

        alert(
          "Selecione uma medicação."
        );

        return;

      }


      if (!motivoAlta) {

        alert(
          "Selecione o motivo da alta/saída."
        );

        return;

      }


      // =================================================
      // BOTÃO
      // =================================================

      const botao =
        document.getElementById(
          "btnSalvar"
        );


      botao.disabled = true;

      botao.textContent =
        "⏳ Salvando...";


      // =================================================
      // ENVIAR
      // =================================================

      fetch("/consulta", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          paciente:
            paciente,

          diagnostico:
            diagnostico,

          medicacao:
            medicacao,

          obs:
            obs,

          motivoAlta:
            motivoAlta,

          justificativaAlta:
            justificativaAlta

        })

      })

      .then(async r => {

        const data =
          await r.json();


        if (!r.ok) {

          throw new Error(
            data.erro ||
            "Erro ao salvar consulta."
          );

        }


        return data;

      })

      .then(data => {

        // =================================================
        // GUARDAR ID
        // =================================================

        ultimaConsultaId =
          data.consulta.id;


        // =================================================
        // LIBERAR PDF
        // =================================================

        document.getElementById(
          "btnPDF"
        ).disabled = false;


        document.getElementById(
          "statusPDF"
        ).textContent =
          "✅ Consulta salva. PDF disponível.";


        alert(
          "✅ Consulta salva com sucesso!"
        );


        // =================================================
        // LIMPAR CAMPOS
        // =================================================

        document.getElementById(
          "diagnostico"
        ).value = "";


        document.getElementById(
          "medicacao"
        ).value = "";


        document.getElementById(
          "obs"
        ).value = "";


        document.getElementById(
          "motivoAlta"
        ).value = "";


        document.getElementById(
          "justificativaAlta"
        ).value = "";


        // =================================================
        // ATUALIZAR FILA
        // =================================================

        carregar();


        // =================================================
        // BAIXAR PDF AUTOMATICAMENTE
        // =================================================

        baixarPDF();

      })

      .catch(error => {

        console.error(error);


        alert(
          error.message ||
          "Não foi possível salvar a consulta."
        );

      })

      .finally(() => {

        botao.disabled = false;

        botao.textContent =
          "💾 Salvar Consulta";

      });

    }


    // =====================================================
    // BAIXAR PDF
    // =====================================================

    function baixarPDF() {

      if (!ultimaConsultaId) {

        alert(
          "Salve uma consulta primeiro."
        );

        return;

      }


      const url =
        "/consulta/" +
        ultimaConsultaId +
        "/pdf";


      const link =
        document.createElement("a");


      link.href = url;

      link.download =
        "consulta-" +
        ultimaConsultaId +
        ".pdf";


      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

    }


    // =====================================================
    // INICIALIZAÇÃO
    // =====================================================

    carregar();

    carregarMedicacoes();


    // Atualizar fila

    setInterval(
      carregar,
      10000
    );

  </script>

</body>

</html>
